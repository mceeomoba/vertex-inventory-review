name: Product feedback
description: Public feedback on Vertex's released inventory tools
title: '[Feedback] '
body:
  - type: markdown
    attributes:
      value: |
        Posted for the Vertex project; AI-assisted.

        Independent of Shopify, not an official Shopify app. No customer use or demand is claimed. Your GitHub username and everything submitted, including screenshots and links, are public. Do not include identifying details, store exports, customer or order data, credentials, private links, or confidential information. Use fictional examples only. This is not a support or security-reporting channel. Respondents' identities will not be reused for outreach.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Inventory edit reviewer
        - Snapshot comparison
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What were you trying to do? Do not include identifying details.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened using public-safe text only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Fictional example (optional)
      description: Invent a small example. No real store data, screenshots, private links or credentials.
  - type: checkboxes
    id: public
    attributes:
      label: Public-data warning
      options:
        - label: I understand my GitHub username and everything I submit are public, and I have excluded identifying and confidential information.
          required: true
